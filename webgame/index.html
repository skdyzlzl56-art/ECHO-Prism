<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECHO PRISM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b1026">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  @font-face{font-family:Galmuri11;src:url(fonts/Galmuri11.woff2) format("woff2");font-weight:400;font-display:swap}   /* UI: battle HUD, name tag, prompts (quiple/galmuri, OFL) */
  @font-face{font-family:Galmuri11;src:url(fonts/Galmuri11-Bold.woff2) format("woff2");font-weight:700;font-display:swap}
  html,body{margin:0;height:100%;background:#0b1026;font-family:Galmuri11,"Malgun Gothic",sans-serif;user-select:none}
  #fit{position:fixed;left:50%;top:50%;width:960px;height:540px;transform:translate(-50%,-50%) scale(var(--k,1))}   /* the 960x540 stage is scaled to fit any screen */
  #stage{position:relative;width:960px;height:540px;
    background:linear-gradient(#1b2a5a,#0b1026);overflow:hidden;cursor:pointer}
  #portrait{position:absolute;left:50%;bottom:150px;width:300px;height:300px;transform:translateX(-50%)}
  #box{position:absolute;left:0;right:0;bottom:0;height:140px;--c:#fff;background:linear-gradient(#0a0f2ae6,#050818f2);border-top:2px solid color-mix(in srgb,var(--c) 70%,transparent);
    box-shadow:0 -10px 28px -12px var(--c);padding:28px 40px 0;color:#f4f6ff;font-size:22px;line-height:1.45;box-sizing:border-box;transition:border-color .3s,box-shadow .3s}   /* the speaker's own colour edges the box, like light through a prism */
  #box::before{content:"";position:absolute;left:0;top:-2px;width:140px;height:2px;background:linear-gradient(90deg,var(--c),#fff);animation:edge 5s ease-in-out infinite alternate}
  @keyframes edge{to{left:calc(100% - 140px)}}
  @media (prefers-reduced-motion:reduce){#box::before{animation:none}}
  #name{font-family:Galmuri11,"Malgun Gothic",sans-serif;position:absolute;left:36px;top:-17px;background:#050818;border-bottom:3px solid var(--c);padding:1px 14px 3px;font-size:20px;font-weight:700;letter-spacing:1px;color:var(--c);text-shadow:0 0 10px var(--c)}
  #name:empty{display:none}
  #next{position:absolute;right:20px;bottom:10px;font-size:18px;animation:b 1s infinite}
  @keyframes b{50%{opacity:0}}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #flash.on{animation:fl .35s ease-out}
  @keyframes fl{0%{opacity:.35}100%{opacity:0}}
  #shout{position:absolute;left:0;right:0;top:35%;text-align:center;font-size:96px;font-weight:900;color:#fff;
    -webkit-text-stroke:3px #c00;text-shadow:0 0 12px #f00;letter-spacing:4px;pointer-events:none;display:none}
  #shout.on{display:block;animation:pop .7s ease-out}
  @keyframes pop{0%{transform:scale(2.5);opacity:0}15%{transform:scale(1);opacity:1}100%{transform:scale(1.05);opacity:1}}
  #stage.shake{animation:sh var(--ms,.5s) linear}
  @keyframes sh{0%,100%{transform:none}20%{transform:translate(calc(-14px*var(--a,1)),0)}40%{transform:translate(calc(14px*var(--a,1)),calc(4px*var(--a,1)))}60%{transform:translate(calc(-10px*var(--a,1)),calc(-4px*var(--a,1)))}80%{transform:translate(calc(10px*var(--a,1)),0)}}
  #vig{position:absolute;inset:0;opacity:0;pointer-events:none;box-shadow:inset 0 0 120px 30px #e00}
  #start{position:absolute;inset:0;display:flex;align-items:center;padding-bottom:70px;box-sizing:border-box;justify-content:center;text-align:center;z-index:30;background:linear-gradient(#222d6e 0%,#5d3f97 52%,#e8806f 88%,#ffc796 100%);color:#fff;font-size:24px}
  #start h1{font-size:72px;letter-spacing:10px;margin:0 0 20px;filter:drop-shadow(0 0 16px #b9a5ff);animation:glow 4s ease-in-out 2s infinite}
  #start h1 span{display:inline-block;color:var(--c);animation:drop 1.1s cubic-bezier(.2,.8,.2,1) calc(.4s + var(--i) * .09s) both,forget 9s linear calc(5s + var(--i) * .1s) infinite}   /* now and then a letter is erased and remembered again */
  @keyframes drop{from{opacity:0;transform:translateY(-60px) scale(1.8);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
  @keyframes forget{0%,84%,100%{opacity:1;transform:none}87%{opacity:.12;transform:translateX(5px)}90%{opacity:.8;transform:translateX(-3px)}93%{opacity:.1}96%{opacity:.9;transform:none}}
  @keyframes glow{50%{filter:drop-shadow(0 0 30px #fff)}}
  #sub{font-size:18px;margin-bottom:10px;animation:rise 1.2s ease-out 1.8s both}
  @keyframes rise{from{opacity:0;transform:translateY(14px);letter-spacing:6px}to{opacity:.85;transform:none;letter-spacing:0}}
  .go #start{animation:go .8s ease-in forwards}   /* the click that begins the game: light swells, the title dissolves */
  @keyframes go{60%{filter:brightness(2.2)}to{opacity:0;transform:scale(1.25);filter:brightness(3)}}
  #start .spec{display:block;height:3px;width:440px;max-width:80%;margin:0 auto 20px;border-radius:2px;background:linear-gradient(90deg,transparent,#ff5a78,#ffaa46,#ffeb6e,#6ee696,#5abeff,#b482ff,transparent);filter:drop-shadow(0 0 6px #ffffffaa);animation:rise 1.2s ease-out 1.4s both}   /* the prism's spectrum, drawn once under the name */
  #start p{display:inline-block;margin:8px 0 0;padding:6px 30px;border:1px solid #ffffff99;border-radius:999px;background:#0b102640;font-size:20px;letter-spacing:4px;box-shadow:0 0 18px #ffffff33;animation:rise 1s ease-out 2.6s both,b 1.4s 3.6s infinite}
  @media (prefers-reduced-motion:reduce){#start h1,#start h1 span,#start p,#sub,#start .spec{animation:none}}
  #bg{position:absolute;inset:0;width:100%;height:100%}
  #act{position:absolute;inset:0;z-index:5;cursor:default}
  #act[hidden],#menu[hidden]{display:none}
  #menu:not([hidden]){display:flex}
  #menu{position:absolute;inset:0;z-index:20;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#0b102699,#02040ccc);color:#fff;cursor:default}
  .mn{position:relative;min-width:360px;padding:24px 36px 18px;text-align:center;font-size:24px;line-height:1.5;background:linear-gradient(#0a0f2af2,#050818f8);border:1px solid #ffffff2e;box-shadow:0 0 44px #4fc3ff2e,inset 0 0 30px #00000066}
  .mn::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:3px;background:linear-gradient(90deg,#ff5a78,#ffaa46,#ffeb6e,#6ee696,#5abeff,#b482ff)}   /* the spectrum edge, same as the title */
  .mn h2{margin:0 0 12px;font-size:26px;letter-spacing:8px;color:#dff4ff;text-shadow:0 0 12px #4fc3ff88}
  .mn .row{position:relative;margin:2px 0;padding:5px 22px;border-left:3px solid transparent;color:#aab7d6}
  .mn .row.on{color:#fff;border-left-color:#fff;background:linear-gradient(90deg,#4fc3ff55,#4fc3ff11 70%,transparent);text-shadow:0 0 10px #4fc3ffcc}
  .mn .row.on::before{content:"▶";position:absolute;left:6px;font-size:14px;top:9px;color:#9fe8ff}
  .mn .ask{margin-bottom:6px;color:#fff}
  .mn .msg{min-height:24px;margin-top:8px;font-size:16px;color:#ffd36b}
  .mn .help{margin-top:2px;padding-top:8px;border-top:1px solid #ffffff1f;font-size:13px;color:#8fb4d8;letter-spacing:.5px}
  .pk{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1026dd;color:#fff;text-align:center}
  .pk h2{margin:0 0 4px;font-size:30px;letter-spacing:4px}
  .pk h3{margin:0;font-size:28px;color:#4fc3ff}
  .pk p{margin:4px 0 12px;font-size:20px;min-height:30px;max-width:640px}
  #cards{display:flex;gap:10px;margin-bottom:14px}
  .card{border:3px solid #456;border-radius:8px;padding:4px;cursor:pointer;background:#0006}
  .card.on{border-color:#fff;box-shadow:0 0 14px #4fc3ff;background:#4fc3ff33}
  #ok{font:inherit;font-size:22px;padding:4px 36px;background:#2a5b8c;color:#fff;border:3px solid #fff;cursor:pointer}
  .pick #box,.pick #portrait,.battle #box{display:none}
  .title #portrait{z-index:31;bottom:auto;left:0;top:0;transform:none;width:960px;height:540px;pointer-events:none}   /* title: one fairy wanders the whole stage (portraits.js titleScene) */
  .battle #portrait{z-index:6;bottom:auto;left:0;top:100px;transform:none;width:960px;height:300px}  /* full-width strip above the dialogue box; portraits.js draws the cast side by side */
  #pad{display:none;position:fixed;inset:0;pointer-events:none;z-index:50;touch-action:none}
  @media (pointer:coarse){#pad{display:block}}
  #dpad{position:absolute;left:14px;top:0;width:var(--pd,150px);height:var(--pd,150px);border-radius:50%;background:#ffffff1a;border:2px solid #ffffff44;pointer-events:none}
  #zone{position:absolute;left:0;top:0;width:50%;height:100%;pointer-events:auto;touch-action:none}
  #dpad{opacity:.45}
  #dpad.on{opacity:1}
  #dpad i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:#ffffff44}
  #dpad.cross i{display:none}
  #dpad.cross{border-radius:0;border:0;clip-path:polygon(33% 0,67% 0,67% 33%,100% 33%,100% 67%,67% 67%,67% 100%,33% 100%,33% 67%,0 67%,0 33%,33% 33%)}
  #pad.edit #dpad,#pad.edit #btns{pointer-events:auto;touch-action:none;opacity:1;outline:2px dashed #ffe27a}
  #pad.edit #zone{pointer-events:none}
  #done{display:none;position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:8px 26px;border-radius:10px;background:#2a5b8c;border:2px solid #fff;color:#fff;font:700 18px Galmuri11,sans-serif;pointer-events:auto}
  #pad.edit #done{display:block}
  #pad,#pad *{-webkit-tap-highlight-color:transparent}
  #btns{pointer-events:auto;position:absolute;left:0;top:0;display:grid;grid-template-columns:repeat(2,var(--bs,68px));gap:10px}
  #btns b{height:var(--bs,68px);border-radius:50%;background:#ffffff1f;border:2px solid #ffffff55;color:#fff;font:700 16px Galmuri11,sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;user-select:none;text-align:center;line-height:1.1}
  #fs{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:10px;background:#ffffff1f;border:2px solid #ffffff55;color:#fff;font:700 24px sans-serif;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none}
  #btns b.on,#dpad.on{background:#4fc3ff66}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="bg" width="960" height="540"></canvas>
  <canvas id="portrait"></canvas>
  <div id="box"><div id="name"></div><span id="text"></span><span id="next" hidden>▼</span></div>
  <div id="flash"></div>
  <div id="vig"></div>
  <div id="shout"></div>
  <div id="act" hidden></div>
  <div id="menu" hidden></div>
  <div id="start"><div><h1><span style="--i:0;--c:#8fe6ff">E</span><span style="--i:1;--c:#b4f0ff">C</span><span style="--i:2;--c:#ffffff">H</span><span style="--i:3;--c:#ffe3f6">O</span><span style="--i:4">&nbsp;</span><span style="--i:5;--c:#ffc4ee">P</span><span style="--i:6;--c:#ffd9b0">R</span><span style="--i:7;--c:#fff1a0">I</span><span style="--i:8;--c:#d8f5b0">S</span><span style="--i:9;--c:#9fe8ff">M</span></h1><i class="spec"></i><div id="sub">......들리나요? 아직 꺼지지 않았군요.</div><p>클릭하여 시작</p></div></div>
</div></div>
<div id="pad"><b id="fs">⛶</b><b id="done">완료</b><div id="zone"></div><div id="dpad"><i></i></div><div id="btns"><b data-k="swap">A</b><b data-k="menu">C</b><b data-k="fire">Z</b><b data-k="dash">X</b></div></div>
<script src="script.js"></script>
<script src="battle/backdrop.js"></script>
<script src="portraits.js"></script>
<script src="dialogue.js"></script>
<script src="menu.js"></script>
<script src="audio.js"></script>
<script src="lineplayer.js"></script>
<script>
const $ = id => document.getElementById(id);
// every sound goes through audio.js (one gain per kind "bgm" | "sfx"; MENU.vol is 0..1 and applies at once); other files use these bare names
let ctx0;   // the AudioContext, kept so the first gesture of any kind can resume it
const audio = createAudio({ volume: k => MENU.vol[k], makeCtx: () => ctx0 = new AudioContext() });
const { sweep, noise, blip, bgm, hush, hushLayer, sfxBus } = audio;

// fx table: shout text, flash, shake, sound, wait (ms) before typing starts
const FX = {
  alert:     { shout: "경고!", flash: 1, shake: 1, wait: 800, sfx: () => { noise(.15); sweep(900, 300, .5); } },
  title:     { shout: "ECHO PRISM", flash: 1, wait: 1600, sfx: () => { sweep(200, 800, 1.2, "sine", .3); sweep(300, 1200, 1.2, "triangle", .2); } },
  shake:     { shake: 1, wait: 500, sfx: () => { noise(.35, .5); sweep(120, 40, .4, "sine", .5); } },
  impact:    { flash: 1, wait: 400, sfx: () => { noise(.08, .6); sweep(200, 60, .2, "sine", .6); setTimeout(() => { noise(.08, .6); sweep(200, 60, .2, "sine", .6); }, 180); } },
};
const retrigger = (el, cls, ms) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };

function play(fx) {
  fx.sfx(); kickPortrait();
  if (fx.flash) retrigger($("flash"), "on", 600);
  if (fx.shake) retrigger($("stage"), "shake", 500);
  if (fx.warp) warp(fx.warp);
  if (fx.ripple) ripple();
  if (fx.shout) { $("shout").textContent = fx.shout; retrigger($("shout"), "on", fx.wait); }
}

const endTitle = () => { setCast(null); stage.classList.remove("title"); };
// what the story player (lineplayer.js) draws through: name tag, text box, portrait, fx
const storyStage = {
  header(sp) { $("name").textContent = sp.name; $("box").style.setProperty("--c", sp.color); setPortrait(sp); },
  text(s) { $("text").textContent = s; },
  next(visible) { $("next").hidden = !visible; },
  fx(name) { const f = FX[name]; if (!f) return 0; play(f); return f.wait; },
  spoke(sp) { blip(sp.pitch); pulsePortrait(); },
  theme: t => setTheme(t),                                   // background mood: night | lantern | silence | flee (portraits.js)
  end() { $("text").textContent = "TO BE CONTINUED..."; $("name").textContent = ""; $("next").hidden = true; },
  restore(r) { for (const w in r.renames) SPEAKERS[w].name = r.renames[w]; for (const w in r.forms) applyForm(w, r.forms[w]); if (r.theme) setTheme(r.theme); },
  skipTitle() { endTitle(); $("start").remove(); },
};
let player, resumeBgm;   // player: made once every script is loaded (below). resumeBgm: music of a loaded save point, started when the title is dismissed
const hold = (k, v) => { if (player) player[k] = v; };

function advance() {
  if (!audio.unlocked) {   // audio needs a gesture: the first click starts the title theme (a loaded scene's music was asked for before and starts here too)
    audio.unlock();
    if ($("start")) { bgm.play("title"); return; }
  }
  if ($("start")) {   // 2nd click: begin, after the title dissolves
    if (!stage.classList.contains("go")) { stage.classList.add("go"); cast.goAt = performance.now(); setTimeout(() => { stage.classList.remove("go"); endTitle(); $("start").remove(); if (resumeBgm && resumeBgm !== "off") bgm.play(resumeBgm); advance(); }, 800); }
    return;
  }
  player.advance();
}

// hold X: type faster (does not advance the line). hold Ctrl: fast-forward dialogue (stops at scenes/effects, which block input anyway)
addEventListener("keydown", e => { if (e.code === KEYS.fast) hold("fast", true); if (e.key === KEYS.skip) hold("skip", true); });
addEventListener("keyup", e => { if (e.code === KEYS.fast) hold("fast", false); if (e.key === KEYS.skip) hold("skip", false); });
addEventListener("blur", () => { hold("fast", false); hold("skip", false); });

$("stage").onclick = advance;
addEventListener("keydown", e => { if (e.code === "Space" || e.code === "Enter" || e.code === "KeyZ") { e.preventDefault(); advance(); } });
// C opens / closes the menu in dialogue and battle (not during other scenes or effects). Captured first so nothing underneath sees the key.
addEventListener("keydown", e => {
  if (!MENU.open) { if (e.code !== "KeyC" || e.repeat || !audio.unlocked || $("start") || player.busy || (player.acting && !stage.classList.contains("battle"))) return; MENU.toggle(); }
  else {
    const r = MENU.key(e.code);
    if (r === "quit") { location.reload(); return; }                 // a fresh load shows the title
    if (r === "save" && stage.classList.contains("battle")) MENU.msg = "전투 중에는 저장할 수 없어요";
    else if (r === "save") try { localStorage.setItem("echoPrismSave", makeSave(player.idx, BOND)); MENU.msg = "저장했어요"; } catch { MENU.msg = "저장할 수 없어요"; }   // BOND only changes when a battle is won, so mid-battle this is the battle's start
    if (r === "move") { MENU.toggle(); editTouch(true); }
    if (r === "load") {
      let has = null; try { has = readSave(localStorage.getItem("echoPrismSave")); } catch {}
      if (!has) MENU.msg = "저장된 데이터가 없어요";
      else { try { sessionStorage.setItem("echoPrismLoad", "1"); } catch {} location.reload(); return; }
    }
  }
  e.preventDefault(); e.stopImmediatePropagation();
  applyTouch(); audio.syncVolumes();                                                           // volume page: applies to playing sound at once
  $("menu").hidden = !MENU.open; $("menu").innerHTML = MENU.open ? menuHtml(MENU) : "";
}, true);
</script>
<script>
// screen fit + touch pad: the pad sends the same key events as a keyboard, so every scene works unchanged
const fit = () => document.getElementById("fit").style.setProperty("--k", Math.min(innerWidth / 960, innerHeight / 540));
addEventListener("resize", fit); fit();
if (matchMedia("(pointer:coarse)").matches) {   // touch: a tap goes fullscreen (hides the address bar) and locks landscape. pointerdown is not a user activation for touch, so listen to pointerup; retry until it works
  const go = () => document.documentElement.requestFullscreen?.().then(() => { removeEventListener("pointerup", go, true); screen.orientation?.lock?.("landscape").catch(() => {}); }).catch(() => {});
  addEventListener("pointerup", go, true);
  document.getElementById("fs").onpointerup = e => { e.stopPropagation(); if (document.fullscreenElement) document.exitFullscreen(); else go(); };   // ⛶ button: back into fullscreen after leaving it
}
{
  const P = document.getElementById("pad");
  document.getElementById("btns").addEventListener("pointerdown", e => e.preventDefault());   // gaps between buttons must not fall through to the stage (battle: any touch = fire toggle)
  document.getElementById("stage").addEventListener("mousedown", e => { if (matchMedia("(pointer:coarse)").matches && document.getElementById("stage").classList.contains("battle")) e.stopPropagation(); }, true);   // touch in battle: only the buttons act, a stray tap no longer toggles fire
  const send = (type, code, key = code) => dispatchEvent(new KeyboardEvent(type, { code, key, bubbles: true, cancelable: true }));
  const code = k => k === "menu" ? "KeyC" : MENU.keys[k];
  for (const b of document.querySelectorAll("#btns b")) {
    let c = null, hold, skipping = false;
    b.onpointerdown = e => { if (P.classList.contains("edit")) return; e.preventDefault(); b.setPointerCapture(e.pointerId); c = code(b.dataset.k); b.classList.add("on"); send("keydown", c); if (b.dataset.k === "fire") hold = setTimeout(() => { skipping = true; send("keydown", "ControlLeft", "Control"); }, 1000); };   // Z held 1 s = Ctrl (skip dialogue) until released
    b.onpointerup = b.onpointercancel = () => { if (!c) return; b.classList.remove("on"); send("keyup", c); c = null; clearTimeout(hold); if (skipping) { skipping = false; send("keyup", "ControlLeft", "Control"); } };
  }
  const pad = document.getElementById("dpad"), dirs = { ArrowLeft: 0, ArrowRight: 0, ArrowUp: 0, ArrowDown: 0 };
  const set = (k, on) => { if (!!dirs[k] !== on) { dirs[k] = on ? 1 : 0; send(on ? "keydown" : "keyup", k); } };
  // floating stick: touch anywhere on the left half and the pad appears under the finger. A quick tap is passed through to what is underneath (dialogue, buttons).
  const zone = document.getElementById("zone"); let t0 = 0, x0 = 0, y0 = 0, cx = 0, cy = 0, id = null;
  const T = MENU.touch, fixedPad = () => T.type === "dpad" || T.mode === "fixed", pos = (() => { try { return JSON.parse(localStorage.getItem("touch_pos")) || {}; } catch { return {}; } })();
  const place = (el, key) => { const p = pos[key] || (key === "dpad" ? [.12, .85] : [.88, .85]);   // saved as 0..1 fractions of the free space, so a resize or rotation keeps the spot
    el.style.left = 14 + p[0] * Math.max(0, innerWidth - el.offsetWidth - 28) + "px"; el.style.top = 14 + p[1] * Math.max(0, innerHeight - el.offsetHeight - 28) + "px"; };
  window.applyTouch = () => {
    P.style.setProperty("--pd", 150 * T.pad / 10 + "px"); P.style.setProperty("--bs", 68 * T.btn / 10 + "px");
    pad.classList.toggle("cross", T.type === "dpad");
    const btns = document.getElementById("btns");
    for (const k of T.corner === "fire" ? ["swap", "menu", "dash", "fire"] : ["swap", "menu", "fire", "dash"]) { const b = btns.querySelector(`[data-k=${k}]`); b.textContent = k === "menu" ? "C" : keyLabel(MENU.keys[k]); btns.append(b); }
    place(pad, "dpad"); place(btns, "btns");
    // fixed: only the pad itself is a touch target; floating: the left half of the screen
    if (fixedPad()) Object.assign(zone.style, { left: pad.offsetLeft - 20 + "px", top: pad.offsetTop - 20 + "px", width: pad.offsetWidth + 40 + "px", height: pad.offsetHeight + 40 + "px" });
    else Object.assign(zone.style, { left: "0", top: "0", width: "50%", height: "100%" });
  };
  window.editTouch = on => { P.classList.toggle("edit", on); if (!on) { applyTouch(); try { localStorage.setItem("touch_pos", JSON.stringify(pos)); } catch {} } };
  for (const [el, key] of [[pad, "dpad"], [document.getElementById("btns"), "btns"]]) {   // edit mode: drag a group where you want it
    let o = null;
    el.addEventListener("pointerdown", e => { if (!P.classList.contains("edit")) return; e.preventDefault(); el.setPointerCapture(e.pointerId); o = [e.clientX - el.offsetLeft, e.clientY - el.offsetTop]; });
    el.addEventListener("pointermove", e => { if (!o) return; const w = Math.max(1, innerWidth - el.offsetWidth - 28), h = Math.max(1, innerHeight - el.offsetHeight - 28);
      pos[key] = [Math.min(1, Math.max(0, (e.clientX - o[0] - 14) / w)), Math.min(1, Math.max(0, (e.clientY - o[1] - 14) / h))]; place(el, key); });
    el.addEventListener("pointerup", () => { o = null; });
  }
  document.getElementById("done").onpointerup = e => { e.stopPropagation(); editTouch(false); };
  addEventListener("resize", applyTouch); applyTouch();
  const aim2 = e => { const x = e.clientX - cx, y = e.clientY - cy, r = pad.offsetWidth, dead = r * (T.type === "dpad" ? .1 : .14), t = r * .12;
    { set("ArrowLeft", x < -dead && -x > Math.abs(y) * .45 - t); set("ArrowRight", x > dead && x > Math.abs(y) * .45 - t);
      set("ArrowUp", y < -dead && -y > Math.abs(x) * .45 - t); set("ArrowDown", y > dead && y > Math.abs(x) * .45 - t); }
    const m = r / 2 - 28, k = Math.min(1, m / (Math.hypot(x, y) || 1)); pad.firstChild.style.transform = `translate(${x * k}px,${y * k}px)`; };
  zone.onpointerdown = e => { e.preventDefault(); zone.setPointerCapture(e.pointerId); id = e.pointerId; t0 = performance.now(); x0 = e.clientX; y0 = e.clientY;
    if (fixedPad()) { cx = pad.offsetLeft + pad.offsetWidth / 2; cy = pad.offsetTop + pad.offsetHeight / 2; aim2(e); }   // fixed: aim from the pad's centre
    else { cx = x0; cy = y0; pad.style.left = cx - pad.offsetWidth / 2 + "px"; pad.style.top = cy - pad.offsetHeight / 2 + "px"; }
    pad.classList.add("on"); };
  zone.onpointermove = e => { if (e.pointerId === id) aim2(e); };
  zone.onpointerup = zone.onpointercancel = e => {
    if (e.pointerId !== id) return; id = null; pad.classList.remove("on"); pad.firstChild.style.transform = ""; for (const k in dirs) set(k, false);
    place(pad, "dpad");
    if (e.type === "pointerup" && !fixedPad() && performance.now() - t0 < 250 && Math.hypot(e.clientX - x0, e.clientY - y0) < 12) {   // tap: click what is under the zone
      zone.style.pointerEvents = "none"; const el = document.elementFromPoint(e.clientX, e.clientY); zone.style.pointerEvents = "";
      if (el) for (const t of ["mousedown", "mouseup", "click"]) el.dispatchEvent(new MouseEvent(t, { bubbles: true, cancelable: true, clientX: e.clientX, clientY: e.clientY }));
    } };
}
