<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ECHO PRISM</title>
<style>
  html,body{margin:0;height:100%;background:#0b1026;font-family:"Malgun Gothic",sans-serif;user-select:none}
  #stage{position:relative;max-width:960px;height:100vh;max-height:540px;margin:auto;top:50%;transform:translateY(-50%);
    background:linear-gradient(#1b2a5a,#0b1026);overflow:hidden;cursor:pointer}
  #portrait{position:absolute;left:50%;bottom:150px;width:300px;height:300px;transform:translateX(-50%)}
  #box{position:absolute;left:0;right:0;bottom:0;height:140px;background:rgba(0,0,30,.88);border-top:4px solid #fff;
    padding:28px 32px 0;color:#fff;font-size:24px;line-height:1.5;box-sizing:border-box}
  #name{position:absolute;left:24px;top:-18px;background:#2a5b8c;border:3px solid #fff;padding:2px 18px;font-size:20px}
  #name:empty{display:none}
  #next{position:absolute;right:20px;bottom:10px;font-size:18px;animation:b 1s infinite}
  @keyframes b{50%{opacity:0}}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #flash.on{animation:fl .35s ease-out}
  @keyframes fl{0%{opacity:.35}100%{opacity:0}}
  #shout{position:absolute;left:0;right:0;top:35%;text-align:center;font-size:96px;font-weight:900;color:#fff;
    -webkit-text-stroke:3px #c00;text-shadow:0 0 12px #f00;letter-spacing:4px;pointer-events:none;display:none}
  #shout.on{display:block;animation:pop .7s ease-out}
  @keyframes pop{0%{transform:scale(2.5);opacity:0}15%{transform:scale(1);opacity:1}100%{transform:scale(1.05);opacity:1}}
  #stage.shake{animation:sh .5s linear}
  @keyframes sh{0%,100%{transform:translateY(-50%)}20%{transform:translate(-14px,-50%)}40%{transform:translate(14px,-46%)}60%{transform:translate(-10px,-54%)}80%{transform:translate(10px,-50%)}}
  #start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#000a;color:#fff;font-size:24px}
  #start h1{font-size:72px;letter-spacing:10px;margin:0 0 20px;text-shadow:0 0 24px #4fc3ff}
  #start p{animation:b 1.4s infinite}
  #bg{position:absolute;inset:0;width:100%;height:100%}
  #act{position:absolute;inset:0;z-index:5;cursor:default}
  #act[hidden],#menu[hidden]{display:none}
  .pk{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0b1026dd;color:#fff;text-align:center}
  .pk h2{margin:0 0 4px;font-size:30px;letter-spacing:4px}
  .pk h3{margin:0;font-size:28px;color:#4fc3ff}
  .pk p{margin:4px 0 12px;font-size:20px;min-height:30px;max-width:640px}
  #cards{display:flex;gap:10px;margin-bottom:14px}
  .card{border:3px solid #456;border-radius:8px;padding:4px;cursor:pointer;background:#0006}
  .card.on{border-color:#fff;box-shadow:0 0 14px #4fc3ff;background:#4fc3ff33}
  #ok{font:inherit;font-size:22px;padding:4px 36px;background:#2a5b8c;color:#fff;border:3px solid #fff;cursor:pointer}
  .pick #box,.pick #portrait,.battle #box{display:none}
  .battle #portrait{z-index:6;bottom:auto;left:0;top:100px;transform:none;width:960px;height:300px}  /* full-width strip above the dialogue box; portraits.js draws the cast side by side */
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="960" height="540"></canvas>
  <canvas id="portrait"></canvas>
  <div id="box"><div id="name"></div><span id="text"></span><span id="next" hidden>▼</span></div>
  <div id="flash"></div>
  <div id="shout"></div>
  <div id="act" hidden></div>
  <div id="menu" hidden style="position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(0,0,20,.85);color:#fff;cursor:default"></div>
  <div id="start"><div><h1>ECHO PRISM</h1><p>클릭하여 시작</p></div></div>
</div>
<script src="script.js"></script>
<script src="portraits.js"></script>
<script src="dialogue.js"></script>
<script src="menu.js"></script>
<script>
const $ = id => document.getElementById(id);
const CHAR_MS = 45;
let ac, idx = -1, busy = false, timer, full = "", speaker, typer = createTyper();

function blip(freq) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = "square"; o.frequency.value = freq * (1 + (Math.random() - .5) * .06);
  g.gain.setValueAtTime(.08, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .06);
  o.connect(g).connect(ac.destination);
  o.start(); o.stop(ac.currentTime + .06);
}

// sound effects: sweep = pitch slide, noise = burst (thud/crash)
function sweep(f0, f1, dur, type = "sawtooth", vol = .25) {
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(t + dur);
}
function noise(dur, vol = .4) {
  const n = ac.sampleRate * dur, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = b; g.gain.value = vol;
  s.connect(g).connect(ac.destination); s.start();
}

// fx table: shout text, flash, shake, sound, wait (ms) before typing starts
const FX = {
  alert:     { shout: "경고!", flash: 1, shake: 1, wait: 800, sfx: () => { noise(.15); sweep(900, 300, .5); } },
  title:     { shout: "ECHO PRISM", flash: 1, wait: 1600, sfx: () => { sweep(200, 800, 1.2, "sine", .3); sweep(300, 1200, 1.2, "triangle", .2); } },
  shake:     { shake: 1, wait: 500, sfx: () => { noise(.35, .5); sweep(120, 40, .4, "sine", .5); } },
  impact:    { flash: 1, wait: 400, sfx: () => { noise(.08, .6); sweep(200, 60, .2, "sine", .6); setTimeout(() => { noise(.08, .6); sweep(200, 60, .2, "sine", .6); }, 180); } },
};
const retrigger = (el, cls, ms) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };

function play(fx) {
  fx.sfx(); kickPortrait();
  if (fx.flash) retrigger($("flash"), "on", 600);
  if (fx.shake) retrigger($("stage"), "shake", 500);
  if (fx.warp) warp(fx.warp);
  if (fx.shout) { $("shout").textContent = fx.shout; retrigger($("shout"), "on", fx.wait); }
}

function show(i) {
  const line = SCRIPT[i]; speaker = SPEAKERS[line.who];
  if (line.rename) speaker.name = line.rename;   // reveal a speaker's real name from this line on
  $("name").textContent = speaker.name;
  setPortrait(speaker);
  full = fixKeys(line.text, MENU.keys); typer.reset(); $("text").textContent = ""; $("next").hidden = true;
  const fx = FX[line.fx];
  if (fx) { busy = true; play(fx); setTimeout(() => { busy = false; timer = setInterval(tick, CHAR_MS); }, fx.wait); }
  else timer = setInterval(tick, CHAR_MS);
}

let xHeld = false;                  // hold X: type faster (does not advance the line)
function tick() {
  if (MENU.open) return;
  typer.add(1, xHeld, full.length); const pos = typer.pos, ch = full[pos - 1];
  $("text").textContent = full.slice(0, pos);
  if (ch.trim() && !/[.,!?…]/.test(ch)) { blip(speaker.pitch); pulsePortrait(); } // sound + pulse only on spoken chars
  if (pos >= full.length) finish();
}

function finish() { typer.pos = full.length; clearInterval(timer); timer = null; $("text").textContent = full; $("next").hidden = false; }

// background music: audio/bgm_<name>.ogg, seamless loop. Web Audio buffer; <audio> fallback (e.g. opened via file://)
const bgm = (() => {
  const VOL = { intro: .18, battle: .2, s1_field: .2, s1_boss: .2, s2_field: .2, s2_boss: .2 };                 // per-track volume, kept below the sound effects
  const bufs = {}; let cur = null, name = null;
  const load = n => bufs[n] ||= fetch(`audio/bgm_${n}.ogg`).then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b));
  const stop = () => {
    name = null; if (!cur) return; const c = cur; cur = null;
    if (c.g) { c.g.gain.setTargetAtTime(0, ac.currentTime, .15); setTimeout(() => c.s.stop(), 800); } else c.a.pause();
  };
  async function play(n) {
    if (name === n) return; stop(); name = n;
    try {
      const buf = await load(n); if (name !== n) return;
      const s = ac.createBufferSource(), g = ac.createGain(); s.buffer = buf; s.loop = true; g.gain.value = VOL[n] ?? .25;
      s.connect(g).connect(ac.destination); s.start(); cur = { s, g };
    } catch {
      if (name !== n) return;
      const a = new Audio(`audio/bgm_${n}.ogg`); a.loop = true; a.volume = VOL[n] ?? .25; a.play().catch(() => {}); cur = { a };
    }
  }
  const vol = k => { if (!cur || !name) return; const v = (VOL[name] ?? .25) * k; if (cur.g) cur.g.gain.setTargetAtTime(v, ac.currentTime, .4); else cur.a.volume = Math.min(1, v); };   // k = 0..1 of the track's normal volume
  return { play, stop, vol };
})();

let acting = false, resumeBgm;   // resumeBgm: music of the loaded save point, started on the first click
function next() {
  if (idx >= SCRIPT.length - 1) {        // end of script
    idx = SCRIPT.length; $("text").textContent = "TO BE CONTINUED..."; $("name").textContent = ""; $("next").hidden = true; return;
  }
  const l = SCRIPT[++idx];
  if (l.bgm === "off") bgm.stop(); else if (l.bgm) bgm.play(l.bgm);
  if (l.theme) setTheme(l.theme);                    // background mood: night | lantern | silence | flee (portraits.js)
  if (l.act) { acting = true; ACTS[l.act](() => { acting = false; next(); }); }   // scene in game.js
  else show(idx);
}

function advance() {
  if (!ac) { ac = new AudioContext(); $("start").remove(); if (resumeBgm && resumeBgm !== "off") bgm.play(resumeBgm); }
  if (MENU.open || busy || acting) return;            // effect or scene playing, no dialogue input
  if (!typer.press(full.length)) return finish();   // first press completes the typing
  next();
}

// hold Ctrl: fast-forward dialogue (stops at scenes/effects, which block input anyway)
let ctrl = false;
addEventListener("keydown", e => { if (e.code === KEYS.fast) xHeld = true; });
addEventListener("keyup", e => { if (e.code === KEYS.fast) xHeld = false; });
addEventListener("blur", () => { xHeld = false; });
addEventListener("keydown", e => { if (e.key === KEYS.skip) ctrl = true; });
addEventListener("keyup", e => { if (e.key === KEYS.skip) ctrl = false; });
addEventListener("blur", () => { ctrl = false; });
setInterval(() => {
  if (MENU.open || !ctrl || !ac || busy || acting || idx >= SCRIPT.length) return;
  if (typer.hold(.09, full.length)) next(); else if (timer) finish();
}, 90);

$("stage").onclick = advance;
addEventListener("keydown", e => { if (e.code === "Space" || e.code === "Enter" || e.code === "KeyZ") { e.preventDefault(); advance(); } });
// C opens / closes the menu in dialogue and battle (not during other scenes or effects). Captured first so nothing underneath sees the key.
addEventListener("keydown", e => {
  if (!MENU.open) { if (e.code !== "KeyC" || e.repeat || !ac || busy || (acting && !stage.classList.contains("battle"))) return; MENU.toggle(); }
  else {
    const r = MENU.key(e.code);
    if (r === "quit") { location.reload(); return; }                 // a fresh load shows the title
    if (r === "save") try { localStorage.setItem("echoPrismSave", makeSave(idx, BOND)); MENU.msg = "저장했어요"; } catch { MENU.msg = "저장할 수 없어요"; }   // BOND only changes when a battle is won, so mid-battle this is the battle's start
    if (r === "load") {
      let has = null; try { has = readSave(localStorage.getItem("echoPrismSave")); } catch {}
      if (!has) MENU.msg = "저장된 데이터가 없어요";
      else { try { sessionStorage.setItem("echoPrismLoad", "1"); } catch {} location.reload(); return; }
    }
  }
  e.preventDefault(); e.stopImmediatePropagation();
  $("menu").hidden = !MENU.open; $("menu").innerHTML = MENU.open ? menuHtml(MENU) : "";
}, true);
</script>
<script src="game.js"></script>
<script src="battle/sim.js"></script>
<script src="battle.js"></script>
<script src="stage1/battles.js"></script>
<script src="stage1/scenes.js"></script>
<script src="stage1/story.js"></script>
<script src="stage2/battles.js"></script>
<script src="stage2/story.js"></script>
<script src="stage3/battles.js"></script>
<script src="stage3/scenes.js"></script>
<script src="stage3/story.js"></script>
<script src="stage4/battles.js"></script>
<script src="stage4/scenes.js"></script>
<script src="stage4/story.js"></script>
<script src="stage5/battles.js"></script>
<script src="stage5/story.js"></script>
<script src="stage6/battles.js"></script>
<script src="stage6/scenes.js"></script>
<script src="stage6/story.js"></script>
<script>
// Load: "불러오기" sets a flag and reloads; here (all scripts ready) the save is applied and the title waits for the click that starts it.
try {
  const sv = sessionStorage.getItem("echoPrismLoad") && readSave(localStorage.getItem("echoPrismSave"));
  sessionStorage.removeItem("echoPrismLoad");
  if (sv) {
    const r = replayState(SCRIPT, sv.idx);
    Object.assign(BOND, sv.bond); idx = Math.min(sv.idx, SCRIPT.length - 1) - 1;
    for (const w in r.renames) SPEAKERS[w].name = r.renames[w];
    if (r.theme) setTheme(r.theme);
    myShape = PLAYER_SHAPES.find(s => s.id === load()) || myShape;
    resumeBgm = r.bgm;
  }
} catch {}
</script>
</body>
</html>
